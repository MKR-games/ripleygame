<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>RIPLEY — 리플리 게임</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn hidden" type="button" aria-label="처음 화면으로" title="처음 화면으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg>
      </button>
      <div class="brand-mini" aria-label="Ripley"><span>R</span><i>I</i><span>PLEY</span></div>
      <button id="fullscreenBtn" class="icon-btn" type="button" aria-label="전체 화면" title="전체 화면">
        <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
      </button>
    </header>

    <main id="screen" class="screen"></main>

    <footer class="footer-note">한 대의 스마트폰 · 인원 설정 가능</footer>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h2 id="modalTitle"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
